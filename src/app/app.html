<div class="app-container" [class.sidebar-open]="auth.isLoggedIn() && router.url !== '/login' && router.url !== '/registro'" [class.navbar-visible]="!auth.isLoggedIn() && router.url !== '/login' && router.url !== '/registro'">

    <ng-container *ngIf="!auth.isLoggedIn() && router.url !== '/login' && router.url !== '/registro'">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm px-4 py-3 fixed-top">
            <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/home">
                <img src="/logo.jpg" alt="JMJ Tours" height="45" class="rounded-circle">
                <span class="fw-bold fs-4">JMJ Tours</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav mx-auto gap-3">
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" routerLink="/home">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" routerLink="/tours">Tours</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" routerLink="/destinos">Destinos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" routerLink="/about">Acerca de</a>
                    </li>
                </ul>

                <div class="d-flex gap-2">
                    <a routerLink="/login" class="btn btn-outline-primary btn-sm px-3">Ingresar</a>
                    <a routerLink="/registro" class="btn btn-primary btn-sm px-3">Registrarse</a>
                </div>
            </div>
        </nav>
    </ng-container>

    <ng-container *ngIf="auth.isLoggedIn() && router.url !== '/login' && router.url !== '/registro'">
        <app-sidebar></app-sidebar>
    </ng-container>

    <main class="main-content">
        <router-outlet></router-outlet>
    </main>

</div>
