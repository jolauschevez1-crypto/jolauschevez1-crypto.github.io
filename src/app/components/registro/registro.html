<div class="auth-page">

    <div class="auth-layout">

        <div class="auth-card">

            <a class="back-link" routerLink="/home">
                ← Volver al inicio
            </a>

            <div class="auth-head">

                <img src="/logo.jpg" alt="JMJ Tours" class="auth-logo">

                <div>
                    <h1>Crear Cuenta</h1>
                    <p>
                        Regístrate para comenzar a reservar los mejores tours de Guayaquil.
                    </p>
                </div>

            </div>

            <form class="auth-form">

                <div class="input-group">
                    <label>Nombre completo</label>
                    <input #name type="text" placeholder="Ingresa tu nombre">
                </div>

                <div class="input-group">
                    <label>Correo electrónico</label>
                    <input #email type="email" placeholder="ejemplo@correo.com">
                </div>

                <div class="input-group">
                    <label>Contraseña</label>
                    <input #password type="password" placeholder="********">
                </div>

                <div class="input-group">
                    <label>Confirmar contraseña</label>
                    <input #confirmPassword type="password" placeholder="********">
                </div>

                <button type="button" class="btn-submit" (click)="register(name,email,password,confirmPassword)">
                    Crear Cuenta
                </button>

            </form>

            <div class="auth-footer">

                <span>
                    ¿Ya tienes una cuenta?
                </span>

                <a routerLink="/login">
                    Iniciar sesión
                </a>

            </div>

        </div>

        <div class="auth-image">

            <div class="image-content">

                <h2>
                    Descubre Guayaquil
                </h2>

                <p>
                    Reserva experiencias únicas y explora los lugares más emblemáticos de la ciudad.
                </p>

            </div>

        </div>

    </div>

</div>
