<div class="auth-page">
    <div class="auth-layout">
        <div class="auth-card">
            <a class="back-link" routerLink="/home">← Volver al inicio</a>
            <div class="auth-card-content">
                <div class="auth-head">
                    <img src="/logo.jpg" alt="JMJ Tours" class="auth-logo">
                    <div>
                        <h1>Regístrate</h1>
                        <p>Regístrate para comenzar a reservar experiencias increíbles.</p>
                    </div>
                </div>

                <div class="auth-form">
                    <div class="input-group">
                        <label for="register-name">Nombre completo</label>
                        <input id="register-name" #name type="text" placeholder="Tu nombre" required>
                    </div>
                    <div class="input-group">
                        <label for="register-email">Correo electrónico</label>
                        <input id="register-email" #email type="email" placeholder="ejemplo@correo.com" required>
                    </div>
                    <div class="input-group">
                        <label for="register-password">Contraseña</label>
                        <input id="register-password" #password type="password" placeholder="********" required>
                    </div>
                    <div class="input-group">
                        <label for="register-confirm">Confirmar contraseña</label>
                        <input id="register-confirm" #confirmPassword type="password" placeholder="********" required>
                    </div>
                    <button type="button" class="btn-submit" (click)="register(name, email, password, confirmPassword)">Crear cuenta</button>
                </div>

                <div class="divider"><span>o regístrate con</span></div>

                <div class="social-row">
                    <button type="button" class="social-btn social-facebook">Facebook</button>
                    <button type="button" class="social-btn social-google">Google</button>
                    <button type="button" class="social-btn social-apple">Apple</button>
                </div>

                <div class="auth-footer">
                    <span>¿Ya tienes cuenta?</span>
                    <a routerLink="/login">Inicia sesión</a>
                </div>
            </div>
        </div>

        <div class="auth-image" role="img" aria-label="Tour scenic image"></div>
    </div>
</div>
